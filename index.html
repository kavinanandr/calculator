<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavin Anand" />
    <meta name="description" content="this is a simple calculator app" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/favicon.ico" />
    <script defer src="main.js"></script>
    <title>Calculator</title>
  </head>
  <body>
    <header>
      <figure>
        <img src="img/logo.png" alt="logo" />
      </figure>
      <h1>Calculator</h1>
    </header>
    <main>
      <div class="calculator">
        <input type="text" readonly />
        <div>
          <button class="keys color" id="plus" onclick="appendToDisplay('+')">
            +
          </button>
          <button class="keys" onclick="appendToDisplay('7')">7</button>
          <button class="keys" onclick="appendToDisplay('8')">8</button>
          <button class="keys" onclick="appendToDisplay('9')">9</button>
          <button class="keys color" onclick="appendToDisplay('-')">-</button>
          <button class="keys" onclick="appendToDisplay('4')">4</button>
          <button class="keys" onclick="appendToDisplay('5')">5</button>
          <button class="keys" onclick="appendToDisplay('6')">6</button>
          <button class="keys color" onclick="appendToDisplay('*')">*</button>
          <button class="keys" onclick="appendToDisplay('1')">1</button>
          <button class="keys" onclick="appendToDisplay('2')">2</button>
          <button class="keys" onclick="appendToDisplay('3')">3</button>
          <button class="keys color" onclick="appendToDisplay('/')">/</button>
          <button class="keys" onclick="appendToDisplay('0')">0</button>
          <button class="keys" onclick="appendToDisplay('.')">.</button>
          <button class="keys" onclick="calculate('=')">=</button>
          <button class="keys color" onclick="clearDisplay()">C</button>
          <button class="keys color" onclick="clearLastChar()">X</button>
        </div>
      </div>
    </main>
  </body>
</html>
