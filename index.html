<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kavin Anand" />
    <meta name="description" content="this is a simple calculator app" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="main.js"></script>
    <title>Calculator</title>
  </head>
  <body>
    <h1>Calculator</h1>
    <main>
      <div>
        <input type="text" readonly />
        <div>
          <button class="keys color" id="plus" onclick="appendToDisplay('+')">+</button>
          <button class="keys" id="seven" onclick="appendToDisplay('7')">7</button>
          <button class="keys" id="eight" onclick="appendToDisplay('8')">8</button>
          <button class="keys" id="nine" onclick="appendToDisplay('9')">9</button>
          <button class="keys color" id="minus" onclick="appendToDisplay('-')">-</button>
          <button class="keys" id="four" onclick="appendToDisplay('4')">4</button>
          <button class="keys" id="five" onclick="appendToDisplay('5')">5</button>
          <button class="keys" id="six" onclick="appendToDisplay('6')">6</button>
          <button class="keys color" id="mul" onclick="appendToDisplay('*')" >*</button>
          <button class="keys" id="one" onclick="appendToDisplay('1')">1</button>
          <button class="keys" id="two" onclick="appendToDisplay('2')">2</button>
          <button class="keys" id="three" onclick="appendToDisplay('3')">3</button>
          <button class="keys color" id="divide" onclick="appendToDisplay('/')">/</button>
          <button class="keys" id="zero" onclick="appendToDisplay('0')">0</button>
          <button class="keys" id="dot" onclick="appendToDisplay('.')">.</button>
          <button class="keys" id="equls" onclick="calculate('=')">=</button>
          <button class="keys color" id="clear" onclick="clearDisplay()">C</button>
        </div>
      </div>
    </main>
  </body>
</html>
